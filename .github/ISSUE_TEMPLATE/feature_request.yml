name: Feature request
description: Propose something new, or a change to existing behavior.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For an open-ended idea that isn't yet a concrete proposal, a
        [Discussion](../../discussions) is often a better fit than an issue
        — it's easier to explore trade-offs there before committing to a
        specific design here.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in, not just the feature you want — it helps us evaluate alternatives.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API/behavior look like? A code sketch is great.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve this, including doing nothing, and why you'd prefer this one.

  - type: dropdown
    id: package
    attributes:
      label: Which package(s) would this affect?
      multiple: true
      options:
        - core
        - router
        - forms
        - di
        - http
        - i18n
        - animate
        - ssr
        - ssg
        - cli
        - compiler
        - interop
        - migrate
        - testing
        - devtools
        - mcp
        - create-aeon
        - Not sure / new package
    validations:
      required: true

  - type: checkboxes
    id: breaking
    attributes:
      label: Would this be a breaking change?
      options:
        - label: I believe this would require a breaking change to existing APIs.
