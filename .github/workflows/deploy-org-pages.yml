name: Publish site to aeon-framework.github.io

# Builds site/ a second time with its base path rewritten from the project
# page's "/aeon" prefix to root ("/"), then pushes the static output to the
# separate Aeon-framework/aeon-framework.github.io repo, which GitHub Pages
# serves at https://aeon-framework.github.io/ with no sub-path.
#
# Why a second build instead of reusing deploy-pages.yml's output: that
# workflow (deploy-pages.yml) builds site/ for THIS repo's own project-page
# deployment at amarnath-karuppasamy-official.github.io/aeon/, where every
# route and asset path is deliberately prefixed with /aeon (see
# site/src/router.js's BASE constant and its own header comment) because
# @aeon-framework/router has no "basename" concept yet and matches
# window.location.pathname directly. A user/org page repo has no such
# prefix, so this job patches BASE to '' and the <script src> in
# site/index.html to match, builds fresh, and discards those two working-tree
# edits afterward — never committing them back here.
#
# Requires a repository secret PAGES_DEPLOY_TOKEN: a GitHub Personal Access
# Token (classic, "repo" scope is enough) with push access to
# Aeon-framework/aeon-framework.github.io. Add it under this repo's Settings
# -> Secrets and variables -> Actions -> New repository secret.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'packages/core/**'
      - 'packages/router/**'
      - 'packages/ssg/**'
      - 'packages/ssr/**'
      - 'packages/cli/**'
      - '.github/workflows/deploy-org-pages.yml'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Rewrite site base path to root for the org/user Pages repo
        run: |
          sed -i "s|export const BASE = '/aeon';|export const BASE = '';|" site/src/router.js
          sed -i 's|src="/aeon/main.js"|src="/main.js"|' site/index.html
          grep -n "BASE = " site/src/router.js
          grep -n "main.js" site/index.html

      - name: Prerender site (root base path)
        run: |
          rm -rf site/dist site/.aeon
          node packages/cli/bin/aeon.mjs prerender site

      - name: Verify build output looks right
        run: |
          test -f site/dist/index.html
          test -f site/dist/main.js
          test -f site/dist/docs/index.html
          grep -q "__aeonPrecompiled" site/dist/main.js

      - name: Push static output to Aeon-framework/aeon-framework.github.io
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          set +e

          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "::error::PAGES_DEPLOY_TOKEN secret is not set on this repo (Settings -> Secrets and variables -> Actions). Skipping publish."
            exit 1
          fi

          rm -rf /tmp/pages-deploy
          mkdir -p /tmp/pages-deploy
          cd /tmp/pages-deploy
          git init -q -b main
          git remote add origin "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/Aeon-framework/aeon-framework.github.io.git"
          git config user.email "aeon-pages-bot@users.noreply.github.com"
          git config user.name "aeon-pages-bot"

          # Diagnostic: verify the token can even see the repo before trying
          # to push. Its (redacted) output is surfaced as a ::error:: build
          # annotation on failure so it's visible on the run summary page
          # without needing to sign in to view raw logs.
          LS_OUT=$(git ls-remote origin main 2>&1)
          LS_CODE=$?
          if [ $LS_CODE -ne 0 ]; then
            SAFE=$(printf '%s' "$LS_OUT" | sed "s/${PAGES_DEPLOY_TOKEN}/REDACTED/g" | tr '\n' ' ')
            echo "::error::git ls-remote failed (exit $LS_CODE): $SAFE"
            exit 1
          fi
          echo "ls-remote ok: $LS_OUT"

          # Pull any existing history if the repo isn't empty (fine either
          # way if it is — an empty/never-pushed repo has no main to fetch).
          FETCH_OUT=$(git fetch origin main 2>&1)
          if [ $? -eq 0 ]; then
            git reset --soft origin/main
          else
            SAFE=$(printf '%s' "$FETCH_OUT" | sed "s/${PAGES_DEPLOY_TOKEN}/REDACTED/g" | tr '\n' ' ')
            echo "::warning::git fetch origin main failed, assuming empty repo: $SAFE"
          fi

          cd "$GITHUB_WORKSPACE"
          cp -r site/dist/. /tmp/pages-deploy/
          cat > /tmp/pages-deploy/README.md <<'DOC'
          # aeon-framework.github.io

          This repo is the **deployed output** of Aeon's landing page + docs site,
          published automatically by the `aeon` monorepo's
          `.github/workflows/deploy-org-pages.yml` on every relevant push to
          `main`. Don't hand-edit files here — they'll be overwritten on the next
          publish.

          Real source: https://github.com/amarnath-karuppasamy-official/aeon/tree/main/site
          DOC

          cd /tmp/pages-deploy
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish site from aeon@${GITHUB_SHA}"

          PUSH_OUT=$(git push -f origin main 2>&1)
          PUSH_CODE=$?
          if [ $PUSH_CODE -ne 0 ]; then
            SAFE=$(printf '%s' "$PUSH_OUT" | sed "s/${PAGES_DEPLOY_TOKEN}/REDACTED/g" | tr '\n' ' ')
            echo "::error::git push failed (exit $PUSH_CODE): $SAFE"
            exit 1
          fi
          echo "Publish succeeded: $PUSH_OUT"
